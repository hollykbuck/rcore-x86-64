name: Build Rust Doc And Run tests

on: [push]

env:
  CARGO_TERM_COLOR: always
  rust_toolchain: stable

jobs:
  build-doc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview
          target: x86_64-unknown-none
      - name: Build doc
        run: cd os && cargo doc --no-deps --verbose
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./os/target/x86_64-unknown-none/doc
          destination_dir: ${{ github.ref_name }}

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview
          target: x86_64-unknown-none
      - uses: actions-rs/install@v0.1
        with:
          crate: cargo-binutils
          version: latest
          use-tool-cache: true
      - name: Cache QEMU
        uses: actions/cache@v3
        with:
          path: qemu-11.0.3
          key: qemu-11.0.3-x86_64
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install autoconf automake autotools-dev curl libmpc-dev libmpfr-dev libgmp-dev \
                               gawk build-essential bison flex texinfo gperf libtool patchutils bc \
                               zlib1g-dev libexpat-dev pkg-config  libglib2.0-dev libpixman-1-dev libsdl2-dev libslirp-dev \
                               python3 python3-pip ninja-build meson libfdt-dev mtools dosfstools ovmf -y
          if [ ! -d qemu-11.0.3 ]; then
            wget https://download.qemu.org/qemu-11.0.3.tar.xz
            tar -xf qemu-11.0.3.tar.xz
            cd qemu-11.0.3
            ./configure --target-list=x86_64-softmmu
            make -j
          else
            cd qemu-11.0.3
          fi
          sudo make install
          qemu-system-x86_64 --version

      - name: Run usertests
        run: |
          cd os
          timeout 360 make run TEST=1 > boot.log 2>&1 || true
          cat boot.log
          grep -q "Usertests passed!" boot.log
